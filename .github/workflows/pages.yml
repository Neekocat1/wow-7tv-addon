# Builds the emote pack builder (web/) and publishes it on GitHub Pages:
# https://neekocat1.github.io/wow-7tv-addon/
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pack builder site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "helper-rs/src/**"
      - "helper-rs/Cargo.*"
      - "addon/SevenTVEmotes_Local/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rust for WebAssembly
        run: rustup update stable && rustup target add wasm32-unknown-unknown
      - name: Build the WebAssembly module
        run: bash web/build.sh
      - name: Test the pack builder
        run: node web/test/pack.test.mjs web/site/pack.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
